services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp_network]

  app:
    image: ghcr.io/jmantonellini/conforma-system:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      BODY_SIZE_LIMIT: 30M
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - cotizacion_uploads:/app/static/uploads/cotizaciones
      - pedido_uploads:/app/uploads/pedidos
      - fabricacion_uploads:/app/uploads/fabricacion
      - adjuntos_uploads:/app/uploads/adjuntos
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp_network]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  dozzle:
    image: amir20/dozzle:v11
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 96m

  beszel:
    image: henrygd/beszel:0.21
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    mem_limit: 128m

  beszel-agent:
    image: henrygd/beszel-agent:0.21
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY:-}
    volumes:
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

volumes:
  postgres_data:
  beszel_data:
  beszel_socket:
  cotizacion_uploads:
  pedido_uploads:
  fabricacion_uploads:
  adjuntos_uploads:
networks:
  erp_network:
    driver: bridge
